<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Le titre dans l'onglet du navigateur -->
  <title>Kit Business</title>
  <meta name="description" content="Générez votre kit business avec l'IA.">

  <!-- L'icône (Favicon) avec la fusée -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

  <link rel="manifest" href="manifest.json">
</head>
<body>
  
  <!-- 👇 L'ÉCRAN DE CHARGEMENT (Splash Screen) 👇 -->
  <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #14123A; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; font-family: sans-serif;">
    <div style="font-size: 60px; margin-bottom: 20px;">🚀</div>
    <h1 style="color: #E8B04B; font-size: 32px; font-weight: bold; letter-spacing: 2px; margin: 0;">KIT BUSINESS</h1>
    <p style="color: #F6EBD4; margin-top: 10px;">Chargement de votre espace...</p>
    <div style="margin-top: 20px; width: 150px; height: 4px; background-color: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
      <div style="width: 50%; height: 100%; background-color: #E8B04B; border-radius: 2px; animation: loading 1.5s infinite ease-in-out;"></div>
    </div>
  </div>

  <style>
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>

  <!-- Le script Flutter -->
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Le script qui efface l'écran de chargement une fois le site prêt -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('splash-screen').style.display = 'none';
    });
  </script>
  
</body>
</html>
