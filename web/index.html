  <link rel="manifest" href="manifest.json">

  <style>
    /* Masquer le badge Netlify */
    #netlify-badge,
    iframe[title="Netlify Drawer"] {
      display: none !important;
    }

    @keyframes chargement {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

</head>
<body>

  <!-- Écran de chargement -->
  <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #14123A; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; font-family: system-ui, -apple-system, sans-serif;">
    <div style="font-size: 54px; margin-bottom: 18px;">🚀</div>
    <h1 style="color: #E8B04B; font-size: 28px; font-weight: 800; letter-spacing: 3px; margin: 0;">KIT BUSINESS</h1>
    <p style="color: #F6EBD4; margin-top: 10px; font-size: 14px;">Vos kits métiers clés en main — 100 % FCFA</p>
    <div style="margin-top: 22px; width: 160px; height: 4px; background-color: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
      <div style="width: 50%; height: 100%; background-color: #E8B04B; border-radius: 2px; animation: chargement 1.5s infinite ease-in-out;"></div>
    </div>
    <p style="color: #B9B4D6; margin-top: 18px; font-size: 11px;">Paiement sécurisé SasPay · livraison WhatsApp &amp; email</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var ecran = document.getElementById('splash-screen');
      if (ecran) ecran.style.display = 'none';
    });
  </script>

</body>
